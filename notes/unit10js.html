<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
    <script>
        function firstFunction() {
            alert('Hello World!');
        }
        function clicky() {
            alert('YEEEEOOOWWWWCHHHHHHH!!!!');
        }
        function hovery() {
            alert('IVE BEEN SQUARSHED');
        }

</head>
<body onload="firstFunction();">

    <p onclick="clicky();">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Beatae, laboriosam temporibus ut recusandae eos sequi, modi quibusdam quo ea quos quae ullam, tempora laudantium fuga molestias asperiores aperiam! Quisquam, veniam!
    </p>
    <h2 onmouseover="hovery();">Hover Text</h2>

</body>
</html>
