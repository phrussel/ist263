<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--makin tables!!-->
    <caption>World Population</caption> <!-- caption tag required -->
    <table> <!-- makes the table -->
        <tr> <!-- "table row" -->
            <th>Country</th> <!-- table header, used for the top row -->
            <th>Population</th>
            <th>% of the World</th>
            <th>Date</th>
        </tr>
        <tr>
            <td>India</td> <!-- table data, fills in a regular cell -->
            <td>1,425,775,850</td>
            <td>17.2%</td>
            <td>14 April 2023</td>
        </tr>
        <tr>
            <td>China</td>
            <td>1,409,670,000</td>
            <td>17.0%</td>
            <td>17 Jan 2024</td>
        </tr>
        <tr>
            <td>United States</td>
            <td>339,777,727</td>
            <td>4.11%</td>
            <td>12 Sep 2026</td>
        </tr>
    </table>


    
</body>
</html>
