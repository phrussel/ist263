<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picker</title>
    <script>
        function changeColor () {
            document.getElementById("wholepage").style.backgroundColor = document.getElementById("picker").value;
        }
    </script>
</head>
<body id="wholepage">
    <form>
        <input id="picker" onchange="changeColor();" type="color">
    </form>
</body>
</html>
